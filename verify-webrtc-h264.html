<!doctype html>
<meta charset="utf-8">
<title>Reynard WebRTC H.264 capability check</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
  pre { background: #111; color: #eee; padding: 1rem; overflow: auto; border-radius: .5rem; }
  .pass { color: #087f23; font-weight: 700; }
  .fail { color: #b00020; font-weight: 700; }
</style>
<h1>Reynard WebRTC H.264 capability check</h1>
<p id="result">Checking…</p>
<pre id="details"></pre>
<script>
const receive = RTCRtpReceiver.getCapabilities?.('video')?.codecs ?? [];
const send = RTCRtpSender.getCapabilities?.('video')?.codecs ?? [];
const isH264 = codec => /^video\/h264$/i.test(codec.mimeType);
const receiveH264 = receive.filter(isH264);
const sendH264 = send.filter(isH264);
const result = document.querySelector('#result');
result.className = receiveH264.length ? 'pass' : 'fail';
result.textContent = receiveH264.length
  ? `PASS: receiver reports ${receiveH264.length} H.264 entr${receiveH264.length === 1 ? 'y' : 'ies'}.`
  : 'FAIL: RTCRtpReceiver still reports no H.264 codec.';
document.querySelector('#details').textContent = JSON.stringify({
  receiveH264,
  sendH264,
  receiveCodecs: receive.map(c => c.mimeType),
  sendCodecs: send.map(c => c.mimeType)
}, null, 2);
</script>
