name: Build Reynard H264 IPA and TIPA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reynard-h264-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26-intel
    timeout-minutes: 360

    env:
      XCODE_VERSION: "26.6"
      CARGO_TERM_COLOR: always
      MOZBUILD_STATE_PATH: ${{ github.workspace }}/.mozbuild

    steps:
      - name: Check out this modified source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Restore Unix script permissions
        shell: bash
        run: |
          set -euo pipefail

          # Zip extraction and Windows commits can lose executable mode bits.
          find tools browser -type f -name '*.sh' -exec chmod 0755 {} +

          test -x tools/development/build-idevice.sh
          test -x tools/development/build-gecko.sh
          test -x tools/release/build-app.sh
          test -x tools/release/create-ipa.sh
          test -x browser/Scripts/AddGecko.sh

          echo "Shell script permissions restored"

      - name: Verify modified Reynard source
        shell: bash
        run: |
          set -euo pipefail

          test "$(tr -d '\000\r\n ' < engine/release.txt)" = "FIREFOX_153_0_RELEASE"
          test -f patches/dom/media/webrtc/jsapi/DefaultCodecPreferences.cpp.patch
          test -f patches/dom/media/webrtc/jsapi/DefaultCodecPreferences.h.patch
          test -f patches/dom/media/webrtc/jsep/JsepCodecDescription.h.patch
          test -f patches/modules/libpref/init/StaticPrefList.yaml.patch

          grep -q "ReceivingH264SupportedStatic" \
            patches/dom/media/webrtc/jsapi/DefaultCodecPreferences.cpp.patch
          grep -q "SendingH264Supported" \
            patches/dom/media/webrtc/jsep/JsepCodecDescription.h.patch
          grep -q "defined(XP_IOS)" \
            patches/modules/libpref/init/StaticPrefList.yaml.patch

          git rev-parse HEAD

      - name: Prepare certificate-free packaging scripts
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              source = path.read_text()
              if new in source:
                  print(f"{label}: already prepared", flush=True)
                  return
              count = source.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{label}: expected one source anchor, found {count}"
                  )
              path.write_text(source.replace(old, new, 1))
              print(f"{label}: prepared", flush=True)

          add_gecko = Path("browser/Scripts/AddGecko.sh")
          replace_once(
              add_gecko,
              'SIGN_IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY:-'
              '${EXPANDED_CODE_SIGN_IDENTITY_NAME:-Apple Development}}"',
              'SIGN_IDENTITY="${REYNARD_CODE_SIGN_IDENTITY:-'
              '${EXPANDED_CODE_SIGN_IDENTITY:-'
              '${EXPANDED_CODE_SIGN_IDENTITY_NAME:-Apple Development}}}"',
              "AddGecko ad-hoc identity override",
          )

          build_app = Path("tools/release/build-app.sh")
          replace_once(
              build_app,
              '''xcodebuild archive -scheme "Reynard" -archivePath "$DIST_DIR/Reynard.xcarchive" -project "$PROJECT_PATH" -sdk iphoneos -arch arm64 -configuration Release -xcconfig "$DIST_DIR/Reynard.xcconfig"
          ''',
              '''set --
          if [ "${REYNARD_CI_UNSIGNED:-0}" = "1" ]; then
            set -- \\
              CODE_SIGNING_ALLOWED=NO \\
              CODE_SIGNING_REQUIRED=NO \\
              CODE_SIGN_STYLE=Manual \\
              CODE_SIGN_IDENTITY= \\
              DEVELOPMENT_TEAM= \\
              PROVISIONING_PROFILE_SPECIFIER=
          fi

          xcodebuild archive \\
            -scheme "Reynard" \\
            -archivePath "$DIST_DIR/Reynard.xcarchive" \\
            -project "$PROJECT_PATH" \\
            -sdk iphoneos \\
            -arch arm64 \\
            -configuration Release \\
            -xcconfig "$DIST_DIR/Reynard.xcconfig" \\
            "$@"
          ''',
              "unsigned Xcode archive mode",
          )

          create_ipa = Path("tools/release/create-ipa.sh")
          replace_once(
              create_ipa,
              '''rm -rf "$WORK_DIR" "$ROOT_DIR/dist/Reynard.ipa" "$ROOT_DIR/dist/Reynard-TrollStore.ipa"
          ''',
              '''rm -rf "$WORK_DIR" "$ROOT_DIR/dist/Reynard.ipa" "$ROOT_DIR/dist/Reynard-TrollStore.tipa" "$ROOT_DIR/dist/Reynard-Jailbroken.ipa"
          ''',
              "TIPA cleanup names",
          )

          replace_once(
              create_ipa,
              '''chmod 0755 "$PTRACE_JIT_OUT"
          ldid -S"$ROOT_DIR/browser/Reynard/JIT/Unsandboxed/ptrace_jit.entitlements" "$PTRACE_JIT_OUT"
          ldid -S"$ROOT_DIR/browser/Reynard/Entitlements/Reynard.private.entitlements" "Payload/Reynard.app/Reynard"
          ldid -S"$ROOT_DIR/browser/Helper/Entitlements/Reynard-Helper.private.entitlements" "Payload/Reynard.app/PlugIns/Reynard Helper.appex/Reynard Helper"
          zip -r ../Reynard-TrollStore.tipa Payload -x "._*" -x ".DS_Store" -x "__MACOSX" # trollstore ipa
          ''',
              '''chmod 0755 "$PTRACE_JIT_OUT"

          # Sign nested executables first, then the main app executable.
          ldid -S"$ROOT_DIR/browser/Reynard/JIT/Unsandboxed/ptrace_jit.entitlements" "$PTRACE_JIT_OUT"
          ldid -S "Payload/Reynard.app/PlugIns/OpenIn.appex/OpenIn"
          ldid -S"$ROOT_DIR/browser/Helper/Entitlements/Reynard-Helper.private.entitlements" "Payload/Reynard.app/PlugIns/Reynard Helper.appex/Reynard Helper"
          ldid -S"$ROOT_DIR/browser/Reynard/Entitlements/Reynard.private.entitlements" "Payload/Reynard.app/Reynard"
          zip -r ../Reynard-TrollStore.tipa Payload -x "._*" -x ".DS_Store" -x "__MACOSX" # trollstore ipa
          ''',
              "nested TIPA signing",
          )
          PY

          grep -q 'REYNARD_CODE_SIGN_IDENTITY' browser/Scripts/AddGecko.sh
          grep -q 'REYNARD_CI_UNSIGNED' tools/release/build-app.sh
          grep -q 'OpenIn.appex/OpenIn' tools/release/create-ipa.sh
          grep -q 'Reynard-TrollStore.tipa' tools/release/create-ipa.sh

          chmod 0755 \
            browser/Scripts/AddGecko.sh \
            tools/release/build-app.sh \
            tools/release/create-ipa.sh

          echo "Certificate-free packaging scripts verified"

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail

          XCODE_PATH="/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          test -d "$XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"

          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Free runner disk space
        shell: bash
        run: |
          set -euxo pipefail

          df -h /
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes/* || true
          rm -rf "$HOME/Library/Developer/CoreSimulator" || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Fetch exact idevice support source
        shell: bash
        run: |
          set -euo pipefail

          IDEVICE_COMMIT="92323d1262598cfcb31aa54ef94c26bb26c5c7a0"
          IDEVICE_DIR="support/idevice"

          rm -rf "$IDEVICE_DIR"
          mkdir -p "$IDEVICE_DIR"

          git -C "$IDEVICE_DIR" init
          git -C "$IDEVICE_DIR" remote add origin \
            https://github.com/jkcoxson/idevice
          git -C "$IDEVICE_DIR" fetch \
            --depth 1 \
            origin \
            "$IDEVICE_COMMIT"
          git -C "$IDEVICE_DIR" checkout --detach FETCH_HEAD

          test "$(git -C "$IDEVICE_DIR" rev-parse HEAD)" = "$IDEVICE_COMMIT"

          # This idevice revision has a stale ffi/libplist entry in
          # .gitmodules but no matching gitlink/directory in its tree.
          # Reynard builds the Rust FFI crate from ffi/Cargo.toml and does not
          # require that nonexistent submodule.
          test -f "$IDEVICE_DIR/Cargo.toml"
          test -f "$IDEVICE_DIR/Cargo.lock"
          test -f "$IDEVICE_DIR/ffi/Cargo.toml"
          test -f "$IDEVICE_DIR/idevice/Cargo.toml"

          cargo metadata \
            --manifest-path "$IDEVICE_DIR/ffi/Cargo.toml" \
            --no-deps \
            --format-version 1 \
            > "$RUNNER_TEMP/idevice-metadata.json"

          grep -q '"name":"idevice-ffi"'             "$RUNNER_TEMP/idevice-metadata.json"

          echo "Fetched and validated Reynard 0.9.0 idevice source at $IDEVICE_COMMIT"

      - name: Restore build caches
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.MOZBUILD_STATE_PATH }}
            ~/.cargo/registry
            ~/.cargo/git
            support/idevice/target
          key: reynard-h264-${{ runner.os }}-${{ runner.arch }}-xcode-${{ env.XCODE_VERSION }}-tools-v9-structural-desktop-capture
          restore-keys: |
            reynard-h264-${{ runner.os }}-${{ runner.arch }}-xcode-${{ env.XCODE_VERSION }}-

      - name: Restore Firefox 153 source archive
        id: firefox-source-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/reynard/firefox-153.0.source.tar.xz
          key: firefox-153.0-source-20260720-v1

      - name: Install and verify build tools
        shell: bash
        run: |
          set -euo pipefail

          command -v ldid >/dev/null 2>&1 || brew install ldid
          brew list lld@19 >/dev/null 2>&1 || brew install lld@19
          command -v cbindgen >/dev/null 2>&1 || brew install cbindgen
          # wasi-runtimes provides compiler-rt/libc++, while wasi-libc
          # provides the C headers and libc used by Firefox's WASI checks.
          brew list wasi-libc >/dev/null 2>&1 || brew install wasi-libc
          brew list wasi-runtimes >/dev/null 2>&1 || brew install wasi-runtimes

          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-ios

          LLD_BIN="$(brew --prefix lld@19)/bin"
          WASI_CLANG="$(brew --prefix llvm)/bin/clang"
          WASI_CLANGXX="$(brew --prefix llvm)/bin/clang++"

          # Homebrew installs the C sysroot and the C++ runtimes into
          # different formula prefixes. Merge both into one sysroot for
          # Firefox instead of relying on ambiguous global symlinks.
          WASI_LIBC_SYSROOT="$(brew --prefix wasi-libc)/share/wasi-sysroot"
          WASI_RUNTIMES_SYSROOT="$(brew --prefix wasi-runtimes)/share/wasi-sysroot"
          WASI_RESOURCE_DIR="$(brew --prefix wasi-runtimes)/share/wasi-runtimes"
          WASI_SYSROOT_DIR="$RUNNER_TEMP/reynard-wasi-sysroot"

          test -x "$LLD_BIN/ld64.lld"
          test -x "$WASI_CLANG"
          test -x "$WASI_CLANGXX"
          test -d "$WASI_LIBC_SYSROOT"
          test -d "$WASI_RUNTIMES_SYSROOT"
          test -d "$WASI_RESOURCE_DIR"

          rm -rf "$WASI_SYSROOT_DIR"
          mkdir -p "$WASI_SYSROOT_DIR"
          rsync -a "$WASI_LIBC_SYSROOT/" "$WASI_SYSROOT_DIR/"
          rsync -a "$WASI_RUNTIMES_SYSROOT/" "$WASI_SYSROOT_DIR/"

          echo "WASI libc sysroot:     $WASI_LIBC_SYSROOT"
          echo "WASI runtime sysroot:  $WASI_RUNTIMES_SYSROOT"
          echo "Merged WASI sysroot:   $WASI_SYSROOT_DIR"
          echo "WASI resource dir:     $WASI_RESOURCE_DIR"

          STRING_H="$(find "$WASI_SYSROOT_DIR" -type f -name string.h -print -quit)"
          CSTRING="$(find "$WASI_SYSROOT_DIR" -type f -name cstring -print -quit)"

          if [ -z "$STRING_H" ]; then
            echo "::error::WASI C header string.h was not found in the merged sysroot"
            find "$WASI_SYSROOT_DIR" -maxdepth 4 -type d | sort
            exit 1
          fi

          if [ -z "$CSTRING" ]; then
            echo "::error::WASI C++ header cstring was not found in the merged sysroot"
            find "$WASI_SYSROOT_DIR" -maxdepth 6 -type d | sort
            exit 1
          fi

          echo "Found C header:   $STRING_H"
          echo "Found C++ header: $CSTRING"

          echo "$LLD_BIN" >> "$GITHUB_PATH"
          export PATH="$LLD_BIN:$PATH"

          # Firefox adds the target and sysroot flags itself. Keep the
          # Homebrew WASI resource directory explicit so Clang can locate
          # compiler-rt and the libc++ runtime.
          export WASM_CC="$WASI_CLANG -resource-dir=$WASI_RESOURCE_DIR"
          export WASM_CXX="$WASI_CLANGXX -resource-dir=$WASI_RESOURCE_DIR"
          export WASI_SYSROOT="$WASI_SYSROOT_DIR"

          {
            echo "WASM_CC=$WASM_CC"
            echo "WASM_CXX=$WASM_CXX"
            echo "WASI_SYSROOT=$WASI_SYSROOT"
          } >> "$GITHUB_ENV"

          "$LLD_BIN/ld64.lld" --version
          cbindgen --version
          rustc --version
          cargo --version

          TEST_DIR="$RUNNER_TEMP/wasi-test"
          rm -rf "$TEST_DIR"
          mkdir -p "$TEST_DIR"

          cat > "$TEST_DIR/test.c" <<'EOF'
          #include <string.h>
          int main(void) { return strlen("reynard") == 7 ? 0 : 1; }
          EOF

          cat > "$TEST_DIR/test.cpp" <<'EOF'
          #include <cstring>
          int main() { return std::strlen("reynard") == 7 ? 0 : 1; }
          EOF

          "$WASI_CLANG" \
            --target=wasm32-wasip1 \
            --sysroot="$WASI_SYSROOT_DIR" \
            -resource-dir="$WASI_RESOURCE_DIR" \
            "$TEST_DIR/test.c" \
            -o "$TEST_DIR/test-c.wasm"

          "$WASI_CLANGXX" \
            --target=wasm32-wasip1 \
            --sysroot="$WASI_SYSROOT_DIR" \
            -resource-dir="$WASI_RESOURCE_DIR" \
            "$TEST_DIR/test.cpp" \
            -o "$TEST_DIR/test-cxx.wasm"

          test -s "$TEST_DIR/test-c.wasm"
          test -s "$TEST_DIR/test-cxx.wasm"
          file "$TEST_DIR/test-c.wasm"
          file "$TEST_DIR/test-cxx.wasm"

      - name: Fetch exact Firefox source
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_TAG="$(tr -d '\000\r' < engine/release.txt | xargs)"
          test "$RELEASE_TAG" = "FIREFOX_153_0_RELEASE"

          CACHE_DIR="$HOME/.cache/reynard"
          ARCHIVE="$CACHE_DIR/firefox-153.0.source.tar.xz"
          ARCHIVE_URL="https://ftp.mozilla.org/pub/firefox/releases/153.0/source/firefox-153.0.source.tar.xz"
          SUMS_URL="https://ftp.mozilla.org/pub/firefox/releases/153.0/SHA256SUMS"
          SUMS_FILE="$RUNNER_TEMP/firefox-153.0-SHA256SUMS"

          mkdir -p "$CACHE_DIR"

          curl --fail --location --retry 5 --retry-all-errors \
            "$SUMS_URL" -o "$SUMS_FILE"

          EXPECTED_HASH="$(
            awk '$2 == "source/firefox-153.0.source.tar.xz" { print $1 }' \
              "$SUMS_FILE"
          )"
          test -n "$EXPECTED_HASH"

          verify_archive() {
            test -s "$ARCHIVE" || return 1
            ACTUAL_HASH="$(shasum -a 256 "$ARCHIVE" | awk '{ print $1 }')"
            test "$ACTUAL_HASH" = "$EXPECTED_HASH"
          }

          if ! verify_archive; then
            rm -f "$ARCHIVE"
            curl --fail --location \
              --retry 5 --retry-all-errors \
              --continue-at - \
              "$ARCHIVE_URL" -o "$ARCHIVE"
          fi

          if ! verify_archive; then
            echo "::error::Firefox source archive checksum verification failed"
            rm -f "$ARCHIVE"
            exit 1
          fi

          rm -rf engine/firefox
          mkdir -p engine/firefox

          tar -xJf "$ARCHIVE" \
            --strip-components=1 \
            -C engine/firefox

          test -f engine/firefox/mach
          test -f engine/firefox/dom/media/webrtc/jsapi/DefaultCodecPreferences.cpp
          test -f engine/firefox/dom/media/webrtc/jsep/JsepCodecDescription.h

          echo "Extracted official Firefox 153.0 source"
          du -sh engine/firefox

      - name: Save Firefox 153 source archive
        if: steps.firefox-source-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/reynard/firefox-153.0.source.tar.xz
          key: firefox-153.0-source-20260720-v1

      - name: Apply Reynard patches and register WebRTC H264
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          firefox = Path("engine/firefox")

          direct_edit_patches = {
              Path("patches/dom/media/webrtc/jsapi/DefaultCodecPreferences.cpp.patch"),
              Path("patches/dom/media/webrtc/jsapi/DefaultCodecPreferences.h.patch"),
              Path("patches/dom/media/webrtc/jsep/JsepCodecDescription.h.patch"),
          }

          patches = [
              patch
              for patch in sorted(Path("patches").rglob("*.patch"))
              if patch not in direct_edit_patches
          ]
          if not patches:
              raise SystemExit("No Reynard Gecko patches were found")

          for patch in patches:
              absolute = str(patch.resolve())
              relative = patch.as_posix()
              print(f"Checking {relative}", flush=True)
              subprocess.run(
                  ["git", "-C", str(firefox), "apply", "--check",
                   "--whitespace=nowarn", absolute],
                  check=True,
              )
              print(f"Applying {relative}", flush=True)
              subprocess.run(
                  ["git", "-C", str(firefox), "apply",
                   "--whitespace=nowarn", absolute],
                  check=True,
              )

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              source = path.read_text()
              if new in source:
                  print(f"{label}: already present", flush=True)
                  return
              count = source.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{label}: expected one source anchor, found {count}"
                  )
              path.write_text(source.replace(old, new, 1))
              print(f"{label}: applied", flush=True)

          cpp = firefox / "dom/media/webrtc/jsapi/DefaultCodecPreferences.cpp"
          header = firefox / "dom/media/webrtc/jsapi/DefaultCodecPreferences.h"
          jsep = firefox / "dom/media/webrtc/jsep/JsepCodecDescription.h"
          prefs = firefox / "modules/libpref/init/StaticPrefList.yaml"

          replace_once(
              cpp,
              '#include "gmp/GMPUtils.h"\n'
              '#include "libwebrtcglue/VideoConduit.h"',
              '#include "gmp/GMPUtils.h"\n'
              '#include "libwebrtcglue/MediaDataCodec.h"\n'
              '#include "libwebrtcglue/VideoConduit.h"',
              "MediaDataCodec include",
          )

          replace_once(
              cpp,
              '''bool DefaultCodecPreferences::H264EnabledStatic() {
            return SoftwareH264EnabledStatic() || HardwareH264EnabledStatic();
          }
          ''',
              '''bool DefaultCodecPreferences::H264EnabledStatic() {
            return SendingH264SupportedStatic() ||
                   ReceivingH264SupportedStatic();
          }

          bool DefaultCodecPreferences::SendingH264SupportedStatic() {
          #ifdef XP_IOS
            const webrtc::SdpVideoFormat h264Format("H264");
            return !MediaDataCodec::SupportsEncoderCodec(h264Format).isEmpty();
          #else
            return SoftwareH264EnabledStatic() || HardwareH264EnabledStatic();
          #endif
          }

          bool DefaultCodecPreferences::ReceivingH264SupportedStatic() {
          #ifdef XP_IOS
            return !MediaDataCodec::SupportsDecoderCodec(
                        webrtc::VideoCodecType::kVideoCodecH264)
                        .isEmpty();
          #else
            return SoftwareH264EnabledStatic() || HardwareH264EnabledStatic();
          #endif
          }
          ''',
              "direction-specific H264 support",
          )

          replace_once(
              header,
              '''  bool H264Enabled() const override { return mH264Enabled; }

            bool SoftwareH264Enabled() const override { return mSoftwareH264Enabled; }
          ''',
              '''  bool H264Enabled() const override { return mH264Enabled; }
            bool SendingH264Supported() const override {
              return mSendingH264Supported;
            }

            bool SoftwareH264Enabled() const override { return mSoftwareH264Enabled; }
          ''',
              "H264 sender capability accessor",
          )

          replace_once(
              header,
              '''  static bool H264EnabledStatic();

            static bool SoftwareH264EnabledStatic();
          ''',
              '''  static bool H264EnabledStatic();

            static bool SendingH264SupportedStatic();

            static bool ReceivingH264SupportedStatic();

            static bool SoftwareH264EnabledStatic();
          ''',
              "H264 support declarations",
          )

          replace_once(
              header,
              '''  const bool mH264Enabled = H264EnabledStatic();
            const bool mSoftwareH264Enabled = SoftwareH264EnabledStatic();
          ''',
              '''  const bool mH264Enabled = H264EnabledStatic();
            const bool mSendingH264Supported = SendingH264SupportedStatic();
            const bool mSoftwareH264Enabled = SoftwareH264EnabledStatic();
          ''',
              "H264 sender capability member",
          )

          replace_once(
              jsep,
              '''  virtual bool H264Enabled() const = 0;
            virtual bool SoftwareH264Enabled() const = 0;
          ''',
              '''  virtual bool H264Enabled() const = 0;
            virtual bool SendingH264Supported() const {
              return H264Enabled();
            }
            virtual bool SoftwareH264Enabled() const = 0;
          ''',
              "JSEP H264 direction preference",
          )

          replace_once(
              jsep,
              '''      aCodec->mProfileLevelId |= aPrefs.H264Level();
              }
              aCodec->mConstraints.maxBr = aPrefs.H264MaxBr();
          ''',
              '''      aCodec->mProfileLevelId |= aPrefs.H264Level();
              }
              if (!aPrefs.SendingH264Supported()) {
                aCodec->mSupportedDirection &= sdp::kRecv;
              }
              aCodec->mConstraints.maxBr = aPrefs.H264MaxBr();
          ''',
              "receive-only H264 direction",
          )

          pref_text = prefs.read_text()
          pref_name = "- name: media.webrtc.hw.h264.enabled"
          pref_start = pref_text.find(pref_name)
          if pref_start < 0:
              raise SystemExit("WebRTC H264 preference block was not found")
          pref_end = pref_text.find("\n- name:", pref_start + len(pref_name))
          if pref_end < 0:
              pref_end = len(pref_text)
          block = pref_text[pref_start:pref_end]

          old_guard = "#if defined(MOZ_WIDGET_ANDROID)"
          new_guard = "#if defined(MOZ_WIDGET_ANDROID) || defined(XP_IOS)"
          if new_guard not in block:
              if block.count(old_guard) != 1:
                  raise SystemExit(
                      "Unexpected media.webrtc.hw.h264.enabled block"
                  )
              block = block.replace(old_guard, new_guard, 1)
              prefs.write_text(
                  pref_text[:pref_start] + block + pref_text[pref_end:]
              )
              print("iOS H264 preference: applied", flush=True)
          else:
              print("iOS H264 preference: already present", flush=True)

          systemservices = firefox / "dom/media/systemservices/moz.build"
          systemservices_text = systemservices.read_text()

          empty_marker = '"video_engine/desktop_capture_impl_empty.cc"'
          mac_marker = '"video_engine/desktop_capture_impl.cc"'
          next_block_marker = '    if "WEBRTC_USE_PIPEWIRE" in DEFINES:'

          empty_pos = systemservices_text.find(empty_marker)
          mac_pos = systemservices_text.find(mac_marker)

          if empty_pos < 0:
              raise SystemExit(
                  "The patched moz.build does not contain the empty "
                  "desktop-capture implementation"
              )
          if mac_pos < 0:
              raise SystemExit(
                  "The patched moz.build does not contain the macOS "
                  "desktop-capture implementation"
              )

          block_start = systemservices_text.rfind(
              "\n    if ", 0, empty_pos
          )
          block_end = systemservices_text.find(
              "\n" + next_block_marker, mac_pos
          )

          if block_start < 0 or block_end < 0 or block_start >= block_end:
              raise SystemExit(
                  "Could not locate the desktop-capture source-selection block"
              )

          block_start += 1
          replacement_block = "\n".join(
              [
                  "    # This source tree is configured only for",
                  "    # Reynard's iOS build. Desktop screen capture is",
                  "    # unavailable here, so use Firefox's empty",
                  "    # implementation instead of the macOS implementation.",
                  "    UNIFIED_SOURCES += [",
                  '        "EmptyDesktopCapturer.cpp",',
                  '        "video_engine/desktop_capture_impl_empty.cc",',
                  "    ]",
                  "",
              ]
          )

          systemservices_text = (
              systemservices_text[:block_start]
              + replacement_block
              + systemservices_text[block_end + 1 :]
          )
          systemservices.write_text(systemservices_text)

          final_text = systemservices.read_text()
          if final_text.count(empty_marker) != 1:
              raise SystemExit(
                  "Expected exactly one empty desktop-capture source"
              )
          if mac_marker in final_text:
              raise SystemExit(
                  "macOS desktop_capture_impl.cc remains in the iOS build file"
              )
          if '"video_engine/tab_capturer.cc"' in final_text:
              raise SystemExit(
                  "macOS tab_capturer.cc remains in the iOS build file"
              )
          if '"video_engine/desktop_device_info.cc"' in final_text:
              raise SystemExit(
                  "macOS desktop_device_info.cc remains in the iOS build file"
              )

          print(
              "iOS empty desktop-capture block structurally rewritten",
              flush=True,
          )
          PY

          grep -q "ReceivingH264SupportedStatic" \
            engine/firefox/dom/media/webrtc/jsapi/DefaultCodecPreferences.cpp
          grep -q "MediaDataCodec::SupportsDecoderCodec" \
            engine/firefox/dom/media/webrtc/jsapi/DefaultCodecPreferences.cpp
          grep -q "SendingH264Supported" \
            engine/firefox/dom/media/webrtc/jsep/JsepCodecDescription.h
          grep -q '#if defined(MOZ_WIDGET_ANDROID) || defined(XP_IOS)' \
            engine/firefox/modules/libpref/init/StaticPrefList.yaml
          grep -q '"video_engine/desktop_capture_impl_empty.cc"' \
            engine/firefox/dom/media/systemservices/moz.build
          ! grep -q '"video_engine/desktop_capture_impl.cc"' \
            engine/firefox/dom/media/systemservices/moz.build
          ! grep -q '"video_engine/tab_capturer.cc"' \
            engine/firefox/dom/media/systemservices/moz.build
          ! grep -q '"video_engine/desktop_device_info.cc"' \
            engine/firefox/dom/media/systemservices/moz.build

          echo "WebRTC H264 and iOS desktop-capture source selection verified"
          sed -n '/This source tree is configured only for/,+8p' \
            engine/firefox/dom/media/systemservices/moz.build
          sed -n '1,65p' \
            engine/firefox/dom/media/webrtc/jsapi/DefaultCodecPreferences.cpp

      - name: Build idevice support library
        shell: bash
        run: |
          set -euo pipefail

          IDEVICE_COMMIT="92323d1262598cfcb31aa54ef94c26bb26c5c7a0"
          test -d support/idevice/.git
          test "$(git -C support/idevice rev-parse HEAD)" = "$IDEVICE_COMMIT"

          bash ./tools/development/build-idevice.sh

          test -s browser/Reynard/JIT/RPPairing/libidevice_ffi.a
          file browser/Reynard/JIT/RPPairing/libidevice_ffi.a

      - name: Preflight Gecko configuration
        shell: bash
        run: |
          set -euo pipefail

          export CBINDGEN="$(command -v cbindgen)"
          test -x "$CBINDGEN"
          test -n "$WASM_CC"
          test -n "$WASM_CXX"
          test -d "$WASI_SYSROOT"

          echo "CBINDGEN=$CBINDGEN"
          echo "WASM_CC=$WASM_CC"
          echo "WASM_CXX=$WASM_CXX"
          echo "WASI_SYSROOT=$WASI_SYSROOT"

          find "$WASI_SYSROOT" -type f -name string.h -print -quit | grep -q .
          find "$WASI_SYSROOT" -type f -name cstring -print -quit | grep -q .

          cat > engine/firefox/.mozconfig <<'EOF'
          ac_add_options --enable-application=mobile/ios
          ac_add_options --target=aarch64-apple-ios
          ac_add_options --enable-ios-target=13.0
          ac_add_options --enable-webrtc
          ac_add_options --enable-optimize
          ac_add_options --disable-debug
          ac_add_options --disable-tests
          EOF

          (
            cd engine/firefox
            ./mach configure
          ) 2>&1 | tee "$RUNNER_TEMP/gecko-configure.log"

          GECKO_OBJ="engine/firefox/obj-aarch64-apple-ios"
          test -d "$GECKO_OBJ"

          if grep -R -F -q "video_engine/desktop_capture_impl.cc" \
              "$GECKO_OBJ"; then
            echo "::error::Configured iOS build still contains macOS desktop_capture_impl.cc"
            grep -R -F -n "video_engine/desktop_capture_impl.cc" \
              "$GECKO_OBJ" | head -20 || true
            exit 1
          fi

          if ! grep -R -F -q "video_engine/desktop_capture_impl_empty.cc" \
              "$GECKO_OBJ"; then
            echo "::error::Configured iOS build did not select desktop_capture_impl_empty.cc"
            grep -R -F -n "desktop_capture" "$GECKO_OBJ" | head -50 || true
            exit 1
          fi

          echo "Configured Gecko backend uses the iOS-safe empty desktop capturer"

      - name: Build Gecko for iOS
        shell: bash
        run: |
          set -euo pipefail

          export CBINDGEN="$(command -v cbindgen)"
          bash ./tools/development/build-gecko.sh \
            2>&1 | tee "$RUNNER_TEMP/gecko-build.log"

      - name: Validate Gecko output
        shell: bash
        run: |
          set -euo pipefail

          GECKO_BIN="engine/firefox/obj-aarch64-apple-ios/dist/bin"
          test -s "$GECKO_BIN/XUL"

          shopt -s nullglob
          DYLIBS=("$GECKO_BIN"/*.dylib)
          test "${#DYLIBS[@]}" -gt 0

          file "$GECKO_BIN/XUL"
          ls -lh "$GECKO_BIN/XUL" "${DYLIBS[@]}"

      - name: Archive unsigned Reynard app
        shell: bash
        env:
          REYNARD_CI_UNSIGNED: "1"
          REYNARD_CODE_SIGN_IDENTITY: "-"
        run: |
          set -euo pipefail

          bash ./tools/release/build-app.sh \
            2>&1 | tee "$RUNNER_TEMP/xcode-archive.log"

      - name: Create IPA and TrollStore TIPA
        shell: bash
        run: |
          set -euo pipefail

          bash ./tools/release/create-ipa.sh \
            2>&1 | tee "$RUNNER_TEMP/package.log"

      - name: Validate packages
        shell: bash
        run: |
          set -euo pipefail

          for PACKAGE in \
            dist/Reynard.ipa \
            dist/Reynard-TrollStore.tipa \
            dist/Reynard-Jailbroken.ipa; do
            test -s "$PACKAGE"
            unzip -tq "$PACKAGE"
          done

          unzip -Z1 dist/Reynard-TrollStore.tipa \
            | grep -q '^Payload/Reynard.app/ptrace_jit$'
          unzip -Z1 dist/Reynard-TrollStore.tipa \
            | grep -q '^Payload/Reynard.app/PlugIns/Reynard Helper.appex/Reynard Helper$'
          unzip -Z1 dist/Reynard-TrollStore.tipa \
            | grep -q '^Payload/Reynard.app/PlugIns/OpenIn.appex/OpenIn$'

          ls -lh \
            dist/Reynard.ipa \
            dist/Reynard-TrollStore.tipa \
            dist/Reynard-Jailbroken.ipa

      - name: Upload IPA and TIPA
        uses: actions/upload-artifact@v4
        with:
          name: Reynard-0.9.0-WebRTC-H264
          path: |
            dist/Reynard.ipa
            dist/Reynard-TrollStore.tipa
            dist/Reynard-Jailbroken.ipa
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostic logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Reynard-build-failure-logs-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/gecko-configure.log
            ${{ runner.temp }}/gecko-build.log
            ${{ runner.temp }}/xcode-archive.log
            ${{ runner.temp }}/package.log
            engine/firefox/obj-aarch64-apple-ios/.mozbuild/logs
          if-no-files-found: ignore
          retention-days: 7
