name: Build Reynard IPA/TIPA

# Mirrors, step for step, the build process documented in README.md and
# implemented in tools/development/*.sh and tools/release/*.sh:
#
#   git clone --recursive https://github.com/minh-ton/reynard-browser
#   ./tools/development/update-gecko.sh
#   ./tools/development/apply-patches.sh
#   ./tools/development/build-idevice.sh
#   ./tools/development/build-gecko.sh
#   (open Reynard.xcodeproj / xcodebuild archive)
#   -> tools/release/build-app.sh + tools/release/create-ipa.sh
#
# NOTE: this is a from-scratch Gecko/Firefox compile targeting
# aarch64-apple-ios. Even cached, this routinely takes 1-4+ hours and can
# need 30-50GB of disk for the source tree + object dir, which is more than
# stock GitHub-hosted macOS runners provide by default. Use a runner with
# enough disk (a `-xlarge` hosted runner or self-hosted Apple Silicon Mac)
# and expect to tune this after a first real run - the maintainer's own
# nightly-build workflow is not public, so this was reconstructed from the
# documented scripts rather than copied from it.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "reynard-browser ref to build (branch, tag, or SHA)"
        required: false
        default: "main"
  push:
    tags:
      - "v*"

env:
  IOS_RUST_TARGET: aarch64-apple-ios

jobs:
  build:
    # macos-26 ships Xcode 26.x by default, which is newer than anything
    # FIREFOX_153_0_RELEASE (engine/release.txt) was validated against.
    # Its default linker doesn't answer moz.configure's `-Wl,--version`
    # linker probe the way Firefox's build system expects, which is why
    # ./mach build fails with "Failed to find an adequate linker" - see
    # the "Install LLVM (real lld)" step below for the actual fix, which
    # works around this regardless of which macOS image you use.
    runs-on: macos-26
    timeout-minutes: 360

    steps:
      - name: Checkout reynard-browser
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
          # Do NOT use `submodules: recursive` here - .gitmodules points
          # engine/firefox at the full mozilla-firefox/firefox history,
          # and a naive recursive checkout will try to clone the whole
          # thing instead of the single shallow release tag that
          # update-gecko.sh fetches below.
          submodules: false
          fetch-depth: 0

      - name: Checkout submodules
        # update-gecko.sh sanity-checks `git submodule status -- engine/firefox`
        # before it does anything else, and bails with "Missing submodule
        # engine/firefox" if that fails. A config-only `git submodule init`
        # (no clone) turned out not to be enough to satisfy that check on
        # this runner's git version - so instead we do the real
        # `submodule update --init --depth 1` for BOTH submodules here,
        # which is the exact same command update-gecko.sh itself runs for
        # engine/firefox right after that check passes. Running it early
        # just means update-gecko.sh's own call is a cheap no-op/re-sync on
        # top of what we already have; it does NOT clone
        # mozilla-firefox/firefox's full history - `--depth 1` still only
        # fetches the tip of the default branch, same as update-gecko.sh
        # would do on its own. update-gecko.sh then fetches and checks out
        # the actual pinned release tag on top of this.
        run: git submodule update --init --depth 1 -- engine/firefox support/idevice

      - name: Select Xcode
        run: sudo xcode-select -p

      - name: Show free disk space
        run: df -h /

      - name: Free up runner disk space
        # Full Gecko builds are large; clear space without touching any
        # installed Xcode (deleting /Applications/Xcode_*.app is both slow -
        # each bundle is tens of GB of small files - and risky, since
        # xcode-select may point at one of those versioned bundles).
        # Simulator runtimes are the big, safe win here: this build targets
        # -sdk iphoneos (a real device), so no simulator runtime is needed.
        run: |
          sudo rm -rf /Users/runner/Library/Android/sdk || true
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes || true
          sudo rm -rf ~/Library/Developer/CoreSimulator/Caches || true
          sudo rm -rf ~/Library/Developer/Xcode/DerivedData || true
          df -h /

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.IOS_RUST_TARGET }}

      - name: Install cbindgen
        # Needed by moz.configure to generate C bindings for
        # gfx/webrender_bindings; not preinstalled on the runner, and not
        # something Homebrew packages, so it's installed via cargo as the
        # configure error itself suggests.
        run: cargo install cbindgen --locked

      - name: Install ldid and lld
        # lld (Homebrew) provides a real ld64.lld. build-gecko.sh points
        # mozconfig at it explicitly (--enable-linker=lld) instead of
        # letting moz.configure autodetect/probe Xcode's own linker, which
        # is what was failing with "Failed to find an adequate linker".
        # Note: ld64.lld used to ship inside the llvm formula; Homebrew has
        # since split it out into its own `lld` formula.
        run: brew install ldid lld

      - name: Confirm Python 3
        run: python3 --version

      - name: Fix script permissions
        run: find tools -name "*.sh" -exec chmod +x {} \;

      - name: Cache Gecko engine checkout + object directory
        uses: actions/cache@v4
        with:
          path: |
            engine/firefox
            !engine/firefox/.git
          key: gecko-${{ runner.os }}-${{ hashFiles('engine/release.txt') }}-${{ hashFiles('patches/**') }}
          restore-keys: |
            gecko-${{ runner.os }}-${{ hashFiles('engine/release.txt') }}-

      - name: Download Gecko at the pinned release tag
        run: ./tools/development/update-gecko.sh

      - name: Reset engine/firefox to a pristine tree
        # The cache step above restores engine/firefox's *files* from
        # whatever a previous run left behind - including patches already
        # applied (tracked-file changes) and any .orig/.rej files from a
        # conflicted `git apply --3way` - even though update-gecko.sh just
        # correctly checked out the right release tag on top of that.
        # apply-patches.sh refuses to run against a dirty tree
        # (`git status --porcelain` must be empty), so discard exactly
        # that leftover diff/untracked cruft here before patching.
        #
        # Deliberately `reset --hard` + `clean -ffd` WITHOUT `-x`: `-x`
        # would also delete gitignored files, which is where Firefox's
        # build object directory normally lives if it's nested under
        # engine/firefox - wiping that out would defeat the point of
        # caching engine/firefox (the object dir) for faster rebuilds.
        # Plain untracked-but-not-ignored cruft still gets removed, which
        # is all that's needed to make apply-patches.sh's check pass.
        run: |
          git -C engine/firefox reset --hard
          git -C engine/firefox clean -ffd

      - name: Apply Reynard's Gecko patches
        run: ./tools/development/apply-patches.sh

      - name: Build idevice FFI static library
        run: ./tools/development/build-idevice.sh

      - name: Build the Gecko engine (aarch64-apple-ios)
        run: ./tools/development/build-gecko.sh

      - name: Archive Reynard.app (unsigned)
        # Per the README, distribution-certificate signing is not part of
        # Reynard's supported sideloading flow (TrollStore/AltStore/SideStore
        # all sign or fake-sign at install time), so the archive step here
        # explicitly disables Xcode's automatic codesigning rather than
        # requiring a real Apple Developer identity/provisioning profile in
        # CI. If the maintainer's real signing setup differs, adjust here.
        run: |
          DIST_DIR="$GITHUB_WORKSPACE/dist"
          PROJECT_PATH="$GITHUB_WORKSPACE/browser/Reynard.xcodeproj"
          XCCONFIG_PATH="$GITHUB_WORKSPACE/browser/Configuration/Reynard.xcconfig"

          rm -rf "$DIST_DIR"
          mkdir -p "$DIST_DIR"
          cp "$XCCONFIG_PATH" "$DIST_DIR/Reynard.xcconfig"

          BUILD_SHA=$(git rev-parse HEAD | cut -c1-7)
          sed -i '' "s/CURRENT_BUILD = .*/CURRENT_BUILD = $BUILD_SHA/" "$DIST_DIR/Reynard.xcconfig"

          xcodebuild archive \
            -scheme "Reynard" \
            -archivePath "$DIST_DIR/Reynard.xcarchive" \
            -project "$PROJECT_PATH" \
            -sdk iphoneos \
            -arch arm64 \
            -configuration Release \
            -xcconfig "$DIST_DIR/Reynard.xcconfig" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Create Reynard.ipa / Reynard-TrollStore.tipa / Reynard-Jailbroken.ipa
        run: ./tools/release/create-ipa.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reynard-ipa-tipa-${{ github.run_number }}
          path: |
            dist/Reynard.ipa
            dist/Reynard-TrollStore.tipa
            dist/Reynard-Jailbroken.ipa
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Reynard.ipa
            dist/Reynard-TrollStore.tipa
            dist/Reynard-Jailbroken.ipa