name: Build Reynard IPA/TIPA

# Mirrors, step for step, the build process documented in README.md and
# implemented in tools/development/*.sh and tools/release/*.sh:
#
#   git clone --recursive https://github.com/minh-ton/reynard-browser
#   ./tools/development/update-gecko.sh
#   ./tools/development/apply-patches.sh
#   ./tools/development/build-idevice.sh
#   ./tools/development/build-gecko.sh
#   (open Reynard.xcodeproj / xcodebuild archive)
#   -> tools/release/build-app.sh + tools/release/create-ipa.sh
#
# NOTE: this is a from-scratch Gecko/Firefox compile targeting
# aarch64-apple-ios. Even cached, this routinely takes 1-4+ hours and can
# need 30-50GB of disk for the source tree + object dir, which is more than
# stock GitHub-hosted macOS runners provide by default. Use a runner with
# enough disk (a `-xlarge` hosted runner or self-hosted Apple Silicon Mac)
# and expect to tune this after a first real run - the maintainer's own
# nightly-build workflow is not public, so this was reconstructed from the
# documented scripts rather than copied from it.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "reynard-browser ref to build (branch, tag, or SHA)"
        required: false
        default: "main"
  push:
    tags:
      - "v*"

env:
  IOS_RUST_TARGET: aarch64-apple-ios

jobs:
  build:
    # Apple Silicon hosted runner. Swap for a `-xlarge` variant or a
    # self-hosted Mac if you hit the disk-space/time limits noted above.
    runs-on: macos-26
    timeout-minutes: 360

    steps:
      - name: Checkout reynard-browser
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
          # Do NOT use `submodules: recursive` here - .gitmodules points
          # engine/firefox at the full mozilla-firefox/firefox history,
          # and a naive recursive checkout will try to clone the whole
          # thing instead of the single shallow release tag that
          # update-gecko.sh fetches below.
          submodules: false
          fetch-depth: 0

      - name: Checkout support/idevice submodule
        run: git submodule update --init --depth 1 -- support/idevice

      - name: Select and verify Xcode 26.6
        shell: bash
        run: |
          set -euo pipefail

          XCODE_DEVELOPER="/Applications/Xcode_26.6.app/Contents/Developer"
          test -d "$XCODE_DEVELOPER"

          sudo xcode-select -s "$XCODE_DEVELOPER"

          echo "DEVELOPER_DIR=$XCODE_DEVELOPER" >> "$GITHUB_ENV"

          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Show free disk space
        run: df -h /

      - name: Free up runner disk space safely
        shell: bash
        run: |
          set -euo pipefail

          sudo rm -rf /Users/runner/Library/Android/sdk || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes/* || true
          rm -rf "$HOME/Library/Developer/CoreSimulator" || true

          # Do not delete /Applications/Xcode_26.6.app.
          test -d "$DEVELOPER_DIR"
          sudo xcode-select -s "$DEVELOPER_DIR"
          xcrun --sdk iphoneos --show-sdk-path

          df -h /

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.IOS_RUST_TARGET }}

      - name: Install signing and linker tools
        shell: bash
        run: |
          set -euo pipefail

          command -v ldid >/dev/null 2>&1 || brew install ldid
          brew list lld@19 >/dev/null 2>&1 || brew install lld@19
          command -v cbindgen >/dev/null 2>&1 || brew install cbindgen

          LLD_BIN="$(brew --prefix lld@19)/bin"

          test -x "$LLD_BIN/ld64.lld"
          test -x "$LLD_BIN/wasm-ld"

          echo "$LLD_BIN" >> "$GITHUB_PATH"
          echo "LLD_BIN=$LLD_BIN" >> "$GITHUB_ENV"

          export PATH="$LLD_BIN:$PATH"

          ld64.lld --version
          wasm-ld --version
          cbindgen --version

      - name: Install and verify WASI SDK
        shell: bash
        run: |
          set -euo pipefail

          # Firefox builds several RLBox libraries as WebAssembly. Xcode's
          # Apple Clang has no wasm32 backend, so use the official WASI SDK
          # only for WASM_CC/WASM_CXX. Keep /usr/bin/clang for iOS itself.
          WASI_VERSION="33"
          WASI_VERSION_FULL="33.0"
          WASI_ASSET="wasi-sdk-${WASI_VERSION_FULL}-arm64-macos.tar.gz"
          WASI_SHA256="85c997a2665ead91673b5bb88b7d0df3fc8900df3bfa244f720d478187bbdc78"
          WASI_URL="https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_VERSION}/${WASI_ASSET}"
          WASI_ARCHIVE="$RUNNER_TEMP/$WASI_ASSET"
          WASI_EXTRACT_ROOT="$RUNNER_TEMP/wasi-sdk-extracted"

          rm -rf "$WASI_EXTRACT_ROOT"
          mkdir -p "$WASI_EXTRACT_ROOT"

          curl --fail --location \
            --retry 5 \
            --retry-all-errors \
            "$WASI_URL" \
            -o "$WASI_ARCHIVE"

          ACTUAL_SHA256="$(
            shasum -a 256 "$WASI_ARCHIVE" | awk '{ print $1 }'
          )"

          if [ "$ACTUAL_SHA256" != "$WASI_SHA256" ]; then
            echo "::error::WASI SDK checksum mismatch"
            echo "Expected: $WASI_SHA256"
            echo "Actual:   $ACTUAL_SHA256"
            exit 1
          fi

          tar -xzf "$WASI_ARCHIVE" -C "$WASI_EXTRACT_ROOT"

          WASI_CLANG="$(
            find "$WASI_EXTRACT_ROOT" \
              -path '*/bin/clang' \
              -type f \
              -print -quit
          )"

          if [ -z "$WASI_CLANG" ]; then
            echo "::error::Could not find bin/clang in the WASI SDK"
            find "$WASI_EXTRACT_ROOT" -maxdepth 4 -print | sort | head -300
            exit 1
          fi

          WASI_SDK_PATH="${WASI_CLANG%/bin/clang}"
          WASI_CLANGXX="$WASI_SDK_PATH/bin/clang++"
          WASI_WASM_LD="$WASI_SDK_PATH/bin/wasm-ld"
          WASI_SYSROOT="$WASI_SDK_PATH/share/wasi-sysroot"

          test -x "$WASI_CLANG"
          test -x "$WASI_CLANGXX"
          test -x "$WASI_WASM_LD"
          test -d "$WASI_SYSROOT"

          {
            echo "WASI_SDK_PATH=$WASI_SDK_PATH"
            echo "WASI_SYSROOT=$WASI_SYSROOT"
            echo "WASM_CC=$WASI_CLANG --sysroot=$WASI_SYSROOT"
            echo "WASM_CXX=$WASI_CLANGXX --sysroot=$WASI_SYSROOT"
          } >> "$GITHUB_ENV"

          "$WASI_CLANG" --version
          "$WASI_WASM_LD" --version

          TEST_DIR="$RUNNER_TEMP/wasi-compiler-test"
          rm -rf "$TEST_DIR"
          mkdir -p "$TEST_DIR"

          cat > "$TEST_DIR/test.c" <<'EOF'
          #include <stdlib.h>
          #include <string.h>

          int main(void) {
            char* value = (char*)malloc(16);
            if (!value) {
              return 1;
            }
            memcpy(value, "reynard", 8);
            int result = value[0] == 'r' ? 0 : 1;
            free(value);
            return result;
          }
          EOF

          cat > "$TEST_DIR/test.cpp" <<'EOF'
          #include <cstdlib>
          #include <cstring>

          int main() {
            auto* value = static_cast<char*>(std::malloc(16));
            if (!value) {
              return 1;
            }
            std::memcpy(value, "reynard", 8);
            int result = value[0] == 'r' ? 0 : 1;
            std::free(value);
            return result;
          }
          EOF

          # Firefox 153 currently probes the compatibility spelling
          # wasm32-wasi, so verify that exact target.
          "$WASI_CLANG" \
            --target=wasm32-wasi \
            --sysroot="$WASI_SYSROOT" \
            -fPIC \
            "$TEST_DIR/test.c" \
            -o "$TEST_DIR/test-c.wasm"

          "$WASI_CLANGXX" \
            --target=wasm32-wasi \
            --sysroot="$WASI_SYSROOT" \
            -fPIC \
            "$TEST_DIR/test.cpp" \
            -o "$TEST_DIR/test-cxx.wasm"

          test -s "$TEST_DIR/test-c.wasm"
          test -s "$TEST_DIR/test-cxx.wasm"

          file "$TEST_DIR/test-c.wasm"
          file "$TEST_DIR/test-cxx.wasm"

          echo "Official WASI SDK compile and link tests passed"

      - name: Confirm Python 3
        run: python3 --version

      - name: Fix script permissions
        run: |
          find tools -name "*.sh" -exec chmod +x {} \;

      - name: Cache Gecko engine checkout + object directory
        uses: actions/cache@v4
        with:
          path: |
            engine/firefox
            !engine/firefox/.git
          key: gecko-wasi33-${{ runner.os }}-${{ hashFiles('engine/release.txt') }}-${{ hashFiles('patches/**') }}
          restore-keys: |
            gecko-wasi33-${{ runner.os }}-${{ hashFiles('engine/release.txt') }}-

      - name: Download Gecko at the pinned release tag
        run: ./tools/development/update-gecko.sh

      - name: Apply Reynard's Gecko patches
        run: ./tools/development/apply-patches.sh

      - name: Build idevice FFI static library
        run: ./tools/development/build-idevice.sh

      - name: Verify Gecko iOS linker
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$LLD_BIN:$PATH"

          test -x "$(command -v ld64.lld)"

          IOS_SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          test -d "$IOS_SDK"

          # This mirrors the linker probe shown in the failed Gecko log.
          /usr/bin/clang \
            -isysroot "$IOS_SDK" \
            -mios-version-min=13.0 \
            --target=aarch64-apple-ios \
            -fuse-ld=lld \
            -Wl,--version

          echo "Gecko can locate ld64.lld while targeting iOS 13.0"

      - name: Build the Gecko engine (aarch64-apple-ios)
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$LLD_BIN:$PATH"

          test -x "${WASM_CC%% *}"
          test -x "${WASM_CXX%% *}"
          test -d "$WASI_SYSROOT"

          echo "iOS compiler:  /usr/bin/clang"
          echo "WASM compiler: $WASM_CC"
          echo "WASM C++:      $WASM_CXX"
          echo "iOS minimum:   13.0"

          ./tools/development/build-gecko.sh

      - name: Archive Reynard.app (unsigned)
        # Per the README, distribution-certificate signing is not part of
        # Reynard's supported sideloading flow (TrollStore/AltStore/SideStore
        # all sign or fake-sign at install time), so the archive step here
        # explicitly disables Xcode's automatic codesigning rather than
        # requiring a real Apple Developer identity/provisioning profile in
        # CI. If the maintainer's real signing setup differs, adjust here.
        run: |
          DIST_DIR="$GITHUB_WORKSPACE/dist"
          PROJECT_PATH="$GITHUB_WORKSPACE/browser/Reynard.xcodeproj"
          XCCONFIG_PATH="$GITHUB_WORKSPACE/browser/Configuration/Reynard.xcconfig"

          rm -rf "$DIST_DIR"
          mkdir -p "$DIST_DIR"
          cp "$XCCONFIG_PATH" "$DIST_DIR/Reynard.xcconfig"

          BUILD_SHA=$(git rev-parse HEAD | cut -c1-7)
          sed -i '' "s/CURRENT_BUILD = .*/CURRENT_BUILD = $BUILD_SHA/" "$DIST_DIR/Reynard.xcconfig"

          xcodebuild archive \
            -scheme "Reynard" \
            -archivePath "$DIST_DIR/Reynard.xcarchive" \
            -project "$PROJECT_PATH" \
            -sdk iphoneos \
            -arch arm64 \
            -configuration Release \
            -xcconfig "$DIST_DIR/Reynard.xcconfig" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Create Reynard.ipa / Reynard-TrollStore.tipa / Reynard-Jailbroken.ipa
        run: ./tools/release/create-ipa.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reynard-ipa-tipa-${{ github.run_number }}
          path: |
            dist/Reynard.ipa
            dist/Reynard-TrollStore.tipa
            dist/Reynard-Jailbroken.ipa
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Reynard.ipa
            dist/Reynard-TrollStore.tipa
            dist/Reynard-Jailbroken.ipa
